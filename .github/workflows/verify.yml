name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress verify

  performance-smoke:
    name: Performance smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate reference evidence
        run: >-
          jq -e
          'length > 0 and all(.[];
          .forks == 2 and
          .warmupIterations == 3 and
          .measurementIterations == 5)'
          docs/results/order-event-ingestion-jdk21.json
          docs/results/executor-workloads-jdk21.json
      - name: Build performance executables
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl jmh-benchmarks,jfr-diagnostics -am package -DskipTests
      - name: Exercise JMH in forked mode
        run: >-
          java -jar jmh-benchmarks/target/benchmarks.jar
          '.*OrderEventIngestionBenchmark.*'
          -p size=100
          -p invalidPercent=5
          -wi 1 -i 1 -f 1
          -w 100ms -r 100ms
      - name: Record and analyze JFR diagnostics
        run: |
          java -Xmx64m -jar jfr-diagnostics/target/jfr-diagnostics.jar \
            record allocation-aware target/ci-smoke.jfr
          java -jar jfr-diagnostics/target/jfr-diagnostics.jar \
            analyze target/ci-smoke.jfr
